name: Build and deploy Python project to Azure Function App - los-functions

on:
  push:
    branches:
      - main
  # Without this the backend suite only ran after merge, so a failing Python
  # test did not block the merge - it just left main broken and undeployed.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Two pushes in quick succession could otherwise deploy out of order.
concurrency:
  group: los-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Nothing in this repo used to EXECUTE the SQL - the tests only read it as
    # text. Parsing proves the grammar, not that a statement runs, which is how
    # a migration comparing name[] to text[] reached a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: costdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for validation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations against a real PostgreSQL
        env:
          COST_DB_HOST: localhost
          COST_DB_PORT: '5432'
          COST_DB_NAME: costdb
          COST_DB_USER: postgres
          COST_DB_PASSWORD: ci-postgres
        run: python scripts/apply_migrations.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        run: npm test

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x "venv/*" \
            -x ".venv/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Pull requests run the tests above but must never deploy.
    if: github.event_name != 'pull_request'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: |
          unzip release.zip
          rm release.zip

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'los-functions'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F2E396E606F243A292B16EE35524E069 }}
          sku: flexconsumption
          remote-build: true
