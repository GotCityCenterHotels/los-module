name: Build and deploy Python project to Azure Function App - los-functions

on:
  push:
    branches:
      - main
  # Without this the backend suite only ran after merge, so a failing Python
  # test did not block the merge - it just left main broken and undeployed.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Two pushes in quick succession could otherwise deploy out of order.
concurrency:
  group: los-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Nothing in this repo used to EXECUTE the SQL - the tests only read it as
    # text. Parsing proves the grammar, not that a statement runs, which is how
    # a migration comparing name[] to text[] reached a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: costdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for validation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations against a real PostgreSQL
        env:
          COST_DB_HOST: localhost
          COST_DB_PORT: '5432'
          COST_DB_NAME: costdb
          COST_DB_USER: postgres
          COST_DB_PASSWORD: ci-postgres
        run: python scripts/apply_migrations.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This job does not deploy the frontend, but tests/build-frontend.test.js
      # skips itself when esbuild is absent - so without npm ci the minify step
      # that the Static Web Apps workflow depends on would go untested here.
      - name: Install frontend build dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # Precompile first-party source so a cold start loads bytecode instead of
      # parsing ~417KB of Python it cannot cache. Worth ~145-190ms per cold
      # start, and worth exactly nothing if the magic tag does not match the
      # runtime - a .pyc from another minor version is ignored, not used. So
      # PYTHON_VERSION above MUST track the Function App's configured Python
      # version; the step prints both halves of that contract for the log.
      #
      # unchecked-hash, not the default timestamp invalidation: the artifact goes
      # through a zip/unzip round trip that does not preserve source mtimes, and
      # a timestamp-invalidated .pyc would be discarded on arrival.
      #
      # The flip side, if you ever run this step by hand in a working tree: an
      # unchecked-hash .pyc is loaded WITHOUT comparing it to its source, so it
      # will shadow every later edit until you delete it. It belongs last, right
      # before packaging, and nowhere else.
      - name: Precompile first-party bytecode
        run: |
          echo "compiling with $(python -V), for a runtime pinned at ${{ env.PYTHON_VERSION }}"
          python -m compileall -q --invalidation-mode unchecked-hash \
            function_app.py cost_database.py database.py \
            services queries shared
          echo "compiled $(find services queries shared -name '*.pyc' | wc -l) modules"

      # Bytecode is kept on purpose - see the compileall step above. The Flex
      # mount is read-only, so the worker can never write a .pyc itself; without
      # one in the package it recompiles every module on every cold start and
      # throws the result away. This job checks out fresh, so the only .pyc in
      # here are the ones compileall just produced against PYTHON_VERSION.
      #
      # The exclusions below mirror .funcignore. functions-action honours
      # .funcignore when it packages the directory, so this is belt-and-braces -
      # but it also keeps the artifact that moves between these two jobs small.
      # tests/ is excluded, so its own __pycache__ goes with it.
      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x "venv/*" \
            -x ".venv/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".python_packages/*" \
            -x "frontend/*" \
            -x "tests/*" \
            -x "scripts/*" \
            -x "node_modules/*" \
            -x "*.md" \
            -x "supplement-profile.json" \
            -x "local.settings.json"

      # A deploy that silently dropped sql/ would still start, and would still
      # serve every database that had already taken its migrations - then fail the
      # first request on a freshly created one, months later, in whichever
      # environment happened to get rebuilt. The schema services and
      # shared/sql_runner.py read these files off disk at runtime, so assert the
      # package still carries them.
      - name: Verify the package keeps its runtime SQL
        run: |
          for required in \
            sql/migrations/017_cost_publication.sql \
            sql/tables/cost_input_settings.sql \
            sql/export/parking_data.sql \
            sql/import/upsert_parking_data.sql
          do
            unzip -l release.zip "$required" | grep -q "$required" \
              || { echo "release.zip is missing $required"; exit 1; }
          done
          test "$(unzip -l release.zip '*.pyc' | grep -c '\.pyc')" -gt 0 \
            || { echo "release.zip carries no bytecode; cold start will recompile"; exit 1; }
          echo "release.zip: $(stat -c%s release.zip) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Pull requests run the tests above but must never deploy.
    if: github.event_name != 'pull_request'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: |
          unzip release.zip
          rm release.zip

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'los-functions'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F2E396E606F243A292B16EE35524E069 }}
          sku: flexconsumption
          remote-build: true
