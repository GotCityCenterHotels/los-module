<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOS Distribution</title>

    <link
        rel="stylesheet"
        href="styles.css?v=86cda912bd"
    >

</head>


<body>

<main class="container">

    <nav class="main-nav" aria-label="Primary navigation">

        <a href="/">
            Average LOS
        </a>

        <a href="/distribution.html" aria-current="page">
            LOS Distribution
        </a>

        <a href="/costdata.html">
            Cost Data
        </a>
        <a href="/costdata-input.html">Cost Input</a>

        <a href="/supplement.html">Supplement</a>

    </nav>


    <header class="page-header">

        <h1>
            LOS Distribution
        </h1>

        <p>
            Explore the distribution of reservations and room nights
            across length-of-stay segments.
        </p>

    </header>


    <section class="filter-panel">

        <div class="filter-field">

            <label for="startDate">
                Start date
            </label>

            <input
                id="startDate"
                type="date"
                value="2026-01-01"
            >

        </div>

        <div class="filter-field">

            <label for="endDate">
                End date
            </label>

            <input
                id="endDate"
                type="date"
                value="2026-12-31"
            >

        </div>


        <div
            class="filter-field month-picker-field"
            role="group"
            aria-labelledby="monthPickerLabel"
        >

            <label id="monthPickerLabel">
                Full months
            </label>

            <div id="monthPicker"></div>

        </div>


        <div class="filter-field">

            <label for="grain">
                Group by
            </label>

            <select id="grain">

                <option value="day">
                    Day
                </option>

                <option value="week">
                    Week
                </option>

                <option
                    value="month"
                    selected
                >
                    Month
                </option>

                <option value="year">
                    Year
                </option>

            </select>

        </div>


        <div class="filter-field">

            <label for="lyComparisonBasis">
                LY comparison
            </label>

            <select id="lyComparisonBasis">

                <option
                    value="sameDate"
                    selected
                >
                    Same date
                </option>

                <option value="sameWeekday">
                    Same weekday
                </option>

            </select>

        </div>


        <div class="filter-field">

            <label for="hotelName">
                Hotel
            </label>

            <select
                id="hotelName"
            >
                <option value="">All hotels</option>
            </select>

        </div>


        <div class="filter-field">

            <label for="metric">
                Distribution
            </label>

            <select id="metric">

                <option
                    value="bookings"
                    selected
                >
                    Reservations
                </option>

                <option value="nights">
                    Room nights
                </option>

            </select>

        </div>


        <div class="filter-field">

            <label for="scenario">
                Scenario
            </label>

            <select id="scenario">

                <option
                    value="current"
                    selected
                >
                    Current
                </option>

                <option value="ly">
                    Actual LY
                </option>

                <option value="spit">
                    SPIT
                </option>

                <option value="all">
                    All comparisons
                </option>

            </select>

        </div>


        <div class="filter-field">

            <label for="level">
                Display
            </label>

            <select id="level">

                <option
                    value="total"
                    selected
                >
                    All hotels combined
                </option>

                <option value="hotels">
                    Hotels
                </option>

            </select>

        </div>


        <div class="filter-action">

            <button id="loadButton">
                Update data
            </button>

        </div>

    </section>


    <div
        class="status-panel"
        role="status"
        aria-live="polite"
    >

        <span id="status">
            Select a period, then click Update data.
        </span>

    </div>


    <section
        id="errorPanel"
        class="error-panel"
        role="alert"
        hidden
    >
    </section>


    <section
        class="results-panel"
        aria-labelledby="distributionTitle"
    >

        <div class="section-heading">

            <h2 id="distributionTitle">
                LOS distribution
            </h2>

        </div>

        <div
            id="distributionResults"
            class="distribution-results"
        >
        </div>

    </section>

</main>


<script src="los-format.js?v=15781a9639"></script>
<script src="los-data.js?v=6ff69a5c9b"></script>
<script src="los-api.js?v=9b170a3022"></script>
<script src="los-period-picker.js?v=1271987354"></script>
<script src="distribution.js?v=594e034549"></script>

</body>

</html>
